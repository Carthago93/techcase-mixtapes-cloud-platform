apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixtapes-api
  namespace: mixtapes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mixtapes-api
  template:
    metadata:
      labels:
        app: mixtapes-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: YOUR_ECR_REGISTRY/mixtapes-api:REPLACE_WITH_VERSION
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
